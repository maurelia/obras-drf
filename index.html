<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f4f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Obras DRF">
<title>Obras DRF</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root {
  --bg: #f2f4f7; --card: #ffffff; --label: #0b0f14; --label2: #4a5361; --label3: #7a8494;
  --sep: rgba(60,67,80,.18); --tint: #0b6aa2; --tint-soft: #dcecf6; --ok: #1f8a3b; --warn: #b26a00; --bad: #c62828;
  --glass: rgba(250,251,253,.72); --glass-brd: rgba(255,255,255,.6); --shadow: 0 6px 24px rgba(15,25,40,.12);
  --r: 14px;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #000; --card: #1c1d20; --label: #f4f6f8; --label2: #b3bac5; --label3: #8b93a0;
    --sep: rgba(200,210,225,.18); --tint: #5cb8ee; --tint-soft: #12324a; --ok: #4cc96d; --warn: #f0a830; --bad: #ff6b6b;
    --glass: rgba(30,31,35,.7); --glass-brd: rgba(255,255,255,.08); --shadow: 0 6px 24px rgba(0,0,0,.5); }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { font: -apple-system-body; }
body { margin: 0; background: var(--bg); color: var(--label);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
  font-size: 1.0625rem; line-height: 1.35; }
button, input, select, textarea { font: inherit; color: inherit; }
input, select, textarea { font-size: max(16px, 1rem); }

/* Barra superior compacta (vidrio) */
#nav { position: fixed; inset: 0 0 auto 0; z-index: 20; padding: env(safe-area-inset-top) 8px 0;
  display: flex; align-items: center; gap: 4px; height: calc(48px + env(safe-area-inset-top));
  background: var(--glass); backdrop-filter: blur(20px) saturate(1.8); -webkit-backdrop-filter: blur(20px) saturate(1.8);
  opacity: 0; pointer-events: none; transition: opacity .2s; }
#nav.show, #nav.sub { opacity: 1; pointer-events: auto; }
#nav h2 { flex: 1; margin: 0; text-align: center; font-size: 1.0625rem; font-weight: 600;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.navbtn { min-width: 44px; height: 44px; border: 0; background: none; color: var(--tint); display: flex;
  align-items: center; gap: 2px; padding: 0 8px; border-radius: 22px; cursor: pointer; }
.navbtn[hidden] { display: flex; visibility: hidden; }

main { padding: calc(env(safe-area-inset-top) + 12px) 16px calc(110px + env(safe-area-inset-bottom)); max-width: 760px; margin: 0 auto; }
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; margin: 36px 0 12px; }
.head h1 { margin: 0; font-size: 2.125rem; font-weight: 700; letter-spacing: .01em; }
.sub main .head { margin-top: 44px; }
h3 { font-size: 1.25rem; margin: 26px 4px 8px; font-weight: 600; }

/* Listas tipo inset grouped */
.group { background: var(--card); border-radius: var(--r); overflow: hidden; }
.row { display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 11px 16px; width: 100%;
  border: 0; background: none; text-align: left; position: relative; cursor: pointer; }
.row + .row::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; border-top: .5px solid var(--sep); }
a.row { color: var(--tint); text-decoration: none; }
.row .main { flex: 1; min-width: 0; }
.row .t { font-weight: 600; }
.row .s { color: var(--label2); font-size: .9375rem; }
.row .chev { color: var(--label3); }
.row:active { background: var(--sep); }
.kv .row { cursor: default; } .kv .row:active { background: none; }
.kv .k { color: var(--label2); flex: 0 0 40%; } .kv .v { flex: 1; text-align: right; overflow-wrap: anywhere; }
.kv .v.pre { white-space: pre-line; text-align: left; }

.badge { display: inline-flex; align-items: center; gap: 4px; font-size: .8125rem; font-weight: 600; padding: 2px 8px;
  border-radius: 10px; background: var(--tint-soft); color: var(--tint); white-space: nowrap; }
.badge.ok { background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok); }
.badge.warn { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); }
.badge.bad { background: color-mix(in srgb, var(--bad) 16%, transparent); color: var(--bad); }
.foot { color: var(--label2); font-size: .8125rem; margin: 6px 16px 0; }

.btn { min-height: 50px; border: 0; border-radius: var(--r); padding: 0 18px; font-weight: 600; cursor: pointer;
  background: var(--tint); color: #fff; width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; }
.btn.sec { background: var(--tint-soft); color: var(--tint); }
.btn.danger { background: none; color: var(--bad); }
.btn:disabled { opacity: .45; cursor: default; }
.btn + .btn { margin-top: 10px; }
.hbtns { display: flex; gap: 10px; }
.round.sec { background: var(--card); color: var(--tint); }
.round { width: 44px; height: 44px; border-radius: 22px; border: 0; background: var(--tint); color: #fff; display: grid; place-items: center; cursor: pointer; box-shadow: var(--shadow); }

.empty { text-align: center; color: var(--label2); padding: 40px 24px; }
.empty svg { color: var(--label3); margin-bottom: 8px; }
.empty b { display: block; color: var(--label); font-size: 1.125rem; margin-bottom: 4px; }
.notice { background: var(--tint-soft); color: var(--label); border-radius: var(--r); padding: 12px 14px; margin: 12px 0; font-size: .9375rem; display: flex; gap: 10px; }
.notice svg { color: var(--tint); flex: none; margin-top: 2px; }
.seg { display: flex; background: var(--sep); border-radius: 10px; padding: 2px; margin: 18px 0 8px; }
.seg button { flex: 1; min-height: 36px; border: 0; background: none; border-radius: 8px; font-size: .9375rem; font-weight: 500; cursor: pointer; }
.seg button[aria-selected="true"] { background: var(--card); box-shadow: 0 1px 4px rgba(0,0,0,.12); font-weight: 600; }
.bar { height: 6px; border-radius: 3px; background: var(--sep); overflow: hidden; margin-top: 6px; }
.bar i { display: block; height: 100%; background: var(--tint); }

/* Tab bar flotante tipo cápsula */
#tabs { position: fixed; z-index: 30; left: 50%; transform: translateX(-50%); bottom: calc(10px + env(safe-area-inset-bottom));
  display: flex; gap: 2px; padding: 4px; border-radius: 32px; background: var(--glass); border: .5px solid var(--glass-brd);
  backdrop-filter: blur(20px) saturate(1.8); -webkit-backdrop-filter: blur(20px) saturate(1.8); box-shadow: var(--shadow);
  transition: transform .25s, padding .25s; }
#tabs button { min-width: 72px; min-height: 52px; border: 0; background: none; border-radius: 26px; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 2px; font-size: .6875rem; font-weight: 600; color: var(--label2); cursor: pointer; }
#tabs button[aria-selected="true"] { color: var(--tint); background: var(--tint-soft); }
#tabs.min button { min-height: 40px; min-width: 52px; } #tabs.min button span { display: none; }

#pill { position: fixed; z-index: 25; top: calc(env(safe-area-inset-top) + 8px); right: 12px; font-size: .75rem; font-weight: 600;
  padding: 4px 10px; border-radius: 12px; background: var(--glass); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border: .5px solid var(--glass-brd); display: none; align-items: center; gap: 6px; }
#pill.show { display: flex; }
#pill i { width: 8px; height: 8px; border-radius: 4px; background: var(--warn); }

/* Sheet (formularios) */
dialog { border: 0; padding: 0; width: min(640px, 100%); max-height: 92dvh; margin: auto auto 0; border-radius: 22px 22px 0 0;
  background: var(--bg); color: var(--label); box-shadow: var(--shadow); }
dialog::backdrop { background: rgba(0,0,0,.35); }
@media (min-width: 700px) { dialog { margin: auto; border-radius: 22px; } }
.sh-head { position: sticky; top: 0; display: flex; align-items: center; padding: 6px 6px 4px; background: var(--glass);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); z-index: 1; }
.sh-head h2 { flex: 1; text-align: center; margin: 0; font-size: 1.0625rem; font-weight: 600; }
.sh-body { padding: 8px 16px calc(24px + env(safe-area-inset-bottom)); }
.field { display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 4px 16px; position: relative; }
.field + .field::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; border-top: .5px solid var(--sep); }
.field label { flex: 0 0 38%; color: var(--label); }
.field input, .field select, .field textarea { flex: 1; min-width: 0; border: 0; background: none; padding: 10px 0; text-align: right; outline: none; }
.field textarea { text-align: left; resize: vertical; }
.field.col { flex-direction: column; align-items: stretch; gap: 0; } .field.col label { padding-top: 10px; color: var(--label2); font-size: .875rem; }
.field input:focus-visible, .field select:focus-visible, .field textarea:focus-visible { color: var(--tint); }
.err { color: var(--bad); font-size: .875rem; margin: 6px 16px; }
.log { font: .8125rem ui-monospace, Menlo, Consolas, monospace; white-space: pre-wrap; background: var(--card); border-radius: var(--r); padding: 12px; margin-top: 10px; }

.toast { position: fixed; left: 16px; right: 16px; bottom: calc(84px + env(safe-area-inset-bottom)); z-index: 40; max-width: 560px; margin: auto; box-shadow: var(--shadow); }
.notice.bad { background: color-mix(in srgb, var(--bad) 12%, var(--card)); } .notice.bad svg { color: var(--bad); }
.row:disabled { cursor: default; color: inherit; opacity: 1; } .row:disabled:active { background: none; }
.ricon { color: var(--tint); display: grid; place-items: center; width: 32px; height: 32px; border-radius: 9px; background: var(--tint-soft); flex: none; }
.pct { font-variant-numeric: tabular-nums; color: var(--label2); font-size: .9375rem; min-width: 3.2em; text-align: right; }
.req { color: var(--bad); font-weight: 600; }

/* Dashboard */
.hero { padding: 16px; }
.hero .hl { color: var(--label2); font-size: .9375rem; }
.hero .hv { font-size: 2.75rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; margin: 2px 0 8px; }
.hero .hs { color: var(--label2); font-size: .8125rem; margin-top: 8px; }
.bar.big { height: 10px; border-radius: 5px; }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 10px; }
@media (min-width: 700px) { .tiles { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.tile { background: var(--card); border-radius: var(--r); padding: 12px 14px; border: 0; text-align: left; min-width: 0; }
button.tile { cursor: pointer; } button.tile:active { background: var(--sep); }
.tile .tk { color: var(--label2); font-size: .8125rem; font-weight: 600; }
.tile .tv { font-size: 1.75rem; font-weight: 700; font-variant-numeric: tabular-nums; margin: 2px 0; }
.tile .ts { color: var(--label3); font-size: .75rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chartbox { position: relative; padding: 8px 6px 2px; }
.chart { width: 100%; height: auto; display: block; touch-action: pan-y; }
.chart .grid { stroke: var(--sep); stroke-width: 1; }
.chart .ax { fill: var(--label3); font-size: 12px; font-family: inherit; }
.chart .ln { fill: none; stroke: var(--tint); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .end, .chart .dot { fill: var(--tint); stroke: var(--card); stroke-width: 2; }
.chart .xh { stroke: var(--label3); stroke-width: 1; stroke-dasharray: 3 3; }
.tip { position: absolute; top: 8px; transform: translateX(-50%); background: var(--card); color: var(--label); box-shadow: var(--shadow);
  border-radius: 10px; padding: 6px 10px; font-size: .8125rem; pointer-events: none; text-align: center; white-space: nowrap; }
details.tabla { margin-top: 8px; } details.tabla summary { cursor: pointer; color: var(--tint); }

/* Formularios de registro */
section h3 { margin-top: 30px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 6px 0 10px; }
.chip { min-height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid var(--sep); background: none; cursor: pointer; font-size: .9375rem; }
.chip[aria-checked="true"] { background: var(--tint); border-color: var(--tint); color: #fff; font-weight: 600; }
.field input.sub { text-align: left; border-top: .5px solid var(--sep); }
.card { margin-bottom: 10px; }
.cardh { display: flex; align-items: center; gap: 8px; padding: 10px 16px 4px; font-weight: 600; font-size: .9375rem; color: var(--label2); }
.cardh .navbtn { margin-left: auto; color: var(--bad); height: 32px; }
.thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; padding: 6px 0; }
.thumb { margin: 0; position: relative; } .thumb img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 10px; background: var(--sep); display: block; }
.thumb figcaption { font-size: .6875rem; color: var(--label3); }
.thumb .x { position: absolute; top: 4px; right: 4px; width: 28px; height: 28px; border-radius: 14px; border: 0; background: rgba(0,0,0,.6); color: #fff; font-size: 1.1rem; cursor: pointer; }
.filebtn { margin: 6px 0 10px; } .filebtn input { display: none; }
.field.col label.btn { color: var(--tint); font-size: 1rem; padding-top: 0; cursor: pointer; }
.filerow { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 0; border-bottom: .5px solid var(--sep); }
.filerow small { color: var(--label3); }
.sig { display: flex; flex-direction: column; gap: 8px; padding: 6px 0 10px; }
.sig img { max-width: 260px; height: 90px; object-fit: contain; background: #fff; border-radius: 8px; border: 1px solid var(--sep); }
.sig span { color: var(--label3); font-size: .9375rem; }
.pad { width: 100%; aspect-ratio: 5 / 2; background: #fff; border-radius: 12px; border: 1px solid var(--sep); touch-action: none; display: block; margin-bottom: 10px; }
.tablewrap { overflow-x: auto; background: var(--card); border-radius: var(--r); }
table.pts { width: 100%; border-collapse: collapse; font-size: .9375rem; font-variant-numeric: tabular-nums; }
.pts th, .pts td { padding: 6px 8px; border-bottom: .5px solid var(--sep); text-align: left; white-space: nowrap; }
.pts thead th { color: var(--label2); font-size: .8125rem; font-weight: 600; position: sticky; top: 0; background: var(--card); }
.pts input { width: 92px; border: 1px solid var(--sep); border-radius: 8px; padding: 6px 8px; background: var(--bg); text-align: right; }
.num { text-align: right !important; }
.actions { display: flex; flex-direction: column; gap: 10px; margin-top: 24px; } .actions .btn + .btn { margin-top: 0; }
.actions.top { margin: 36px 0 12px; }
@media (min-width: 700px) { .actions.top { flex-direction: row; } }

/* Documento (lectura / impresión) */
.doc { background: var(--card); border-radius: var(--r); padding: 18px; font-size: .9375rem; }
.dochead { display: flex; justify-content: space-between; gap: 12px; border-bottom: 2px solid var(--label); padding-bottom: 8px; font-size: .8125rem; }
.dochead .dc { text-align: right; }
.doctitle { font-size: 1.125rem; text-align: center; margin: 14px 0; text-transform: uppercase; letter-spacing: .02em; }
.docsec h4 { margin: 18px 0 6px; font-size: .9375rem; text-transform: uppercase; color: var(--tint); }
table.kvt, table.dt { width: 100%; border-collapse: collapse; }
.kvt th { text-align: left; font-weight: 500; color: var(--label2); width: 38%; padding: 5px 8px 5px 0; vertical-align: top; border-bottom: .5px solid var(--sep); }
.kvt td { padding: 5px 0; border-bottom: .5px solid var(--sep); overflow-wrap: anywhere; }
.dt th, .dt td { border: .5px solid var(--sep); padding: 5px 6px; text-align: left; vertical-align: top; font-size: .8125rem; }
.dt th { background: var(--bg); font-weight: 600; }
.muted { color: var(--label2); } .small { font-size: .8125rem; }
.sigimg { height: 56px; max-width: 180px; object-fit: contain; background: #fff; }
.docphotos { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; margin-top: 6px; }
.docphotos figure { margin: 0; break-inside: avoid; } .docphotos img { width: 100%; border-radius: 6px; background: var(--sep); display: block; }
.docphotos figcaption { font-size: .75rem; color: var(--label2); }
.docfoot { margin-top: 20px; font-size: .75rem; color: var(--label3); text-align: right; }

@media print {
  @page { margin: 14mm; }
  #nav, #tabs, #pill, .noprint, .toast { display: none !important; }
  body { background: #fff; color: #000; font-size: 11pt; }
  main { padding: 0; max-width: none; }
  .doc { padding: 0; border-radius: 0; background: #fff; color: #000; }
  .dochead { border-color: #000; } .docsec h4 { color: #000; }
  .dt th { background: #eee; } .dt th, .dt td, .kvt th, .kvt td { border-color: #999; }
  .tablewrap { overflow: visible; background: none; }
  .badge { background: none !important; border: 1px solid currentColor; }
  tr, .docsec h4 { break-inside: avoid; }
}

/* PDF para SharePoint: mismo documento, siempre en claro y a ancho A4.
   html2pdf clona solo .pdfdoc, por eso los colores van ahí y no en .pdfbox. */
.pdfbox { position: fixed; left: -10000px; top: 0; z-index: -1; }
.pdfdoc { width: 690px; /* A4 menos márgenes de 10 mm */ --card: #fff; --bg: #eee; --label: #000; --label2: #333; --label3: #666; --sep: #999; --tint: #000;
  background: #fff; color: #000; font-size: 13px; color-scheme: light; }
.pdfdoc .doc { padding: 0; border-radius: 0; font-size: 12px; background: #fff; color: #000; }
.pdfdoc .tablewrap { overflow: visible; }
.pdfdoc .badge { background: none !important; border: 1px solid currentColor; color: #000; }
.pdfdoc .docphotos { grid-template-columns: repeat(2, 1fr); }
.pdfdoc .sigimg { object-fit: fill; width: auto; height: 56px; max-width: none; }
.pdfdoc .docphotos img { height: auto; }

.skel { height: 64px; border-radius: var(--r); background: linear-gradient(90deg, var(--card), var(--sep), var(--card)); background-size: 200% 100%; animation: sk 1.2s infinite; margin-bottom: 8px; }
@keyframes sk { to { background-position: -200% 0; } }

@media (prefers-reduced-transparency: reduce) { #nav, #tabs, #pill, .sh-head { background: var(--card); backdrop-filter: none; -webkit-backdrop-filter: none; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<header id="nav">
  <button class="navbtn" id="back" hidden aria-label="Atrás"></button>
  <h2 id="navTitle"></h2>
  <span class="navbtn" hidden></span>
</header>
<div id="pill" role="status"><i></i><span></span></div>
<main id="view" aria-live="polite"></main>
<nav id="tabs" role="tablist" aria-label="Secciones"></nav>
<dialog id="sheet" aria-labelledby="shTitle"></dialog>

<script src="vendor/msal-browser.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
