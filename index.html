<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f4f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Obras DRF">
<title>Obras DRF</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root {
  --bg: #f2f4f7; --card: #ffffff; --label: #0b0f14; --label2: #4a5361; --label3: #7a8494;
  --sep: rgba(60,67,80,.18); --tint: #0b6aa2; --tint-soft: #dcecf6; --ok: #1f8a3b; --warn: #b26a00; --bad: #c62828;
  --glass: rgba(250,251,253,.72); --glass-brd: rgba(255,255,255,.6); --shadow: 0 6px 24px rgba(15,25,40,.12);
  --r: 14px;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #000; --card: #1c1d20; --label: #f4f6f8; --label2: #b3bac5; --label3: #8b93a0;
    --sep: rgba(200,210,225,.18); --tint: #5cb8ee; --tint-soft: #12324a; --ok: #4cc96d; --warn: #f0a830; --bad: #ff6b6b;
    --glass: rgba(30,31,35,.7); --glass-brd: rgba(255,255,255,.08); --shadow: 0 6px 24px rgba(0,0,0,.5); }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { font: -apple-system-body; }
body { margin: 0; background: var(--bg); color: var(--label);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
  font-size: 1.0625rem; line-height: 1.35; }
button, input, select, textarea { font: inherit; color: inherit; }
input, select, textarea { font-size: max(16px, 1rem); }

/* Barra superior compacta (vidrio) */
#nav { position: fixed; inset: 0 0 auto 0; z-index: 20; padding: env(safe-area-inset-top) 8px 0;
  display: flex; align-items: center; gap: 4px; height: calc(48px + env(safe-area-inset-top));
  background: var(--glass); backdrop-filter: blur(20px) saturate(1.8); -webkit-backdrop-filter: blur(20px) saturate(1.8);
  opacity: 0; pointer-events: none; transition: opacity .2s; }
#nav.show, #nav.sub { opacity: 1; pointer-events: auto; }
#nav h2 { flex: 1; margin: 0; text-align: center; font-size: 1.0625rem; font-weight: 600;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.navbtn { min-width: 44px; height: 44px; border: 0; background: none; color: var(--tint); display: flex;
  align-items: center; gap: 2px; padding: 0 8px; border-radius: 22px; cursor: pointer; }
.navbtn[hidden] { display: flex; visibility: hidden; }

main { padding: calc(env(safe-area-inset-top) + 12px) 16px calc(110px + env(safe-area-inset-bottom)); max-width: 760px; margin: 0 auto; }
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; margin: 36px 0 12px; }
.head h1 { margin: 0; font-size: 2.125rem; font-weight: 700; letter-spacing: .01em; }
.sub main .head { margin-top: 44px; }
h3 { font-size: 1.25rem; margin: 26px 4px 8px; font-weight: 600; }

/* Listas tipo inset grouped */
.group { background: var(--card); border-radius: var(--r); overflow: hidden; }
.row { display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 11px 16px; width: 100%;
  border: 0; background: none; text-align: left; position: relative; cursor: pointer; }
.row + .row::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; border-top: .5px solid var(--sep); }
a.row { color: var(--tint); text-decoration: none; }
.row .main { flex: 1; min-width: 0; }
.row .t { font-weight: 600; }
.row .s { color: var(--label2); font-size: .9375rem; }
.row .chev { color: var(--label3); }
.row:active { background: var(--sep); }
.kv .row { cursor: default; } .kv .row:active { background: none; }
.kv .k { color: var(--label2); flex: 0 0 40%; } .kv .v { flex: 1; text-align: right; overflow-wrap: anywhere; }

.badge { display: inline-flex; align-items: center; gap: 4px; font-size: .8125rem; font-weight: 600; padding: 2px 8px;
  border-radius: 10px; background: var(--tint-soft); color: var(--tint); white-space: nowrap; }
.badge.ok { background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok); }
.badge.warn { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); }
.badge.bad { background: color-mix(in srgb, var(--bad) 16%, transparent); color: var(--bad); }
.foot { color: var(--label2); font-size: .8125rem; margin: 6px 16px 0; }

.btn { min-height: 50px; border: 0; border-radius: var(--r); padding: 0 18px; font-weight: 600; cursor: pointer;
  background: var(--tint); color: #fff; width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; }
.btn.sec { background: var(--tint-soft); color: var(--tint); }
.btn.danger { background: none; color: var(--bad); }
.btn:disabled { opacity: .45; cursor: default; }
.btn + .btn { margin-top: 10px; }
.round { width: 44px; height: 44px; border-radius: 22px; border: 0; background: var(--tint); color: #fff; display: grid; place-items: center; cursor: pointer; box-shadow: var(--shadow); }

.empty { text-align: center; color: var(--label2); padding: 40px 24px; }
.empty svg { color: var(--label3); margin-bottom: 8px; }
.empty b { display: block; color: var(--label); font-size: 1.125rem; margin-bottom: 4px; }
.notice { background: var(--tint-soft); color: var(--label); border-radius: var(--r); padding: 12px 14px; margin: 12px 0; font-size: .9375rem; display: flex; gap: 10px; }
.notice svg { color: var(--tint); flex: none; margin-top: 2px; }
.seg { display: flex; background: var(--sep); border-radius: 10px; padding: 2px; margin: 18px 0 8px; }
.seg button { flex: 1; min-height: 36px; border: 0; background: none; border-radius: 8px; font-size: .9375rem; font-weight: 500; cursor: pointer; }
.seg button[aria-selected="true"] { background: var(--card); box-shadow: 0 1px 4px rgba(0,0,0,.12); font-weight: 600; }
.bar { height: 6px; border-radius: 3px; background: var(--sep); overflow: hidden; margin-top: 6px; }
.bar i { display: block; height: 100%; background: var(--tint); }

/* Tab bar flotante tipo cápsula */
#tabs { position: fixed; z-index: 30; left: 50%; transform: translateX(-50%); bottom: calc(10px + env(safe-area-inset-bottom));
  display: flex; gap: 2px; padding: 4px; border-radius: 32px; background: var(--glass); border: .5px solid var(--glass-brd);
  backdrop-filter: blur(20px) saturate(1.8); -webkit-backdrop-filter: blur(20px) saturate(1.8); box-shadow: var(--shadow);
  transition: transform .25s, padding .25s; }
#tabs button { min-width: 72px; min-height: 52px; border: 0; background: none; border-radius: 26px; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 2px; font-size: .6875rem; font-weight: 600; color: var(--label2); cursor: pointer; }
#tabs button[aria-selected="true"] { color: var(--tint); background: var(--tint-soft); }
#tabs.min button { min-height: 40px; min-width: 52px; } #tabs.min button span { display: none; }

#pill { position: fixed; z-index: 25; top: calc(env(safe-area-inset-top) + 8px); right: 12px; font-size: .75rem; font-weight: 600;
  padding: 4px 10px; border-radius: 12px; background: var(--glass); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border: .5px solid var(--glass-brd); display: none; align-items: center; gap: 6px; }
#pill.show { display: flex; }
#pill i { width: 8px; height: 8px; border-radius: 4px; background: var(--warn); }

/* Sheet (formularios) */
dialog { border: 0; padding: 0; width: min(640px, 100%); max-height: 92dvh; margin: auto auto 0; border-radius: 22px 22px 0 0;
  background: var(--bg); color: var(--label); box-shadow: var(--shadow); }
dialog::backdrop { background: rgba(0,0,0,.35); }
@media (min-width: 700px) { dialog { margin: auto; border-radius: 22px; } }
.sh-head { position: sticky; top: 0; display: flex; align-items: center; padding: 6px 6px 4px; background: var(--glass);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); z-index: 1; }
.sh-head h2 { flex: 1; text-align: center; margin: 0; font-size: 1.0625rem; font-weight: 600; }
.sh-body { padding: 8px 16px calc(24px + env(safe-area-inset-bottom)); }
.field { display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 4px 16px; position: relative; }
.field + .field::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; border-top: .5px solid var(--sep); }
.field label { flex: 0 0 38%; color: var(--label); }
.field input, .field select, .field textarea { flex: 1; min-width: 0; border: 0; background: none; padding: 10px 0; text-align: right; outline: none; }
.field textarea { text-align: left; resize: vertical; }
.field.col { flex-direction: column; align-items: stretch; gap: 0; } .field.col label { padding-top: 10px; color: var(--label2); font-size: .875rem; }
.field input:focus-visible, .field select:focus-visible, .field textarea:focus-visible { color: var(--tint); }
.err { color: var(--bad); font-size: .875rem; margin: 6px 16px; }
.log { font: .8125rem ui-monospace, Menlo, Consolas, monospace; white-space: pre-wrap; background: var(--card); border-radius: var(--r); padding: 12px; margin-top: 10px; }

.skel { height: 64px; border-radius: var(--r); background: linear-gradient(90deg, var(--card), var(--sep), var(--card)); background-size: 200% 100%; animation: sk 1.2s infinite; margin-bottom: 8px; }
@keyframes sk { to { background-position: -200% 0; } }

@media (prefers-reduced-transparency: reduce) { #nav, #tabs, #pill, .sh-head { background: var(--card); backdrop-filter: none; -webkit-backdrop-filter: none; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<header id="nav">
  <button class="navbtn" id="back" hidden aria-label="Atrás"></button>
  <h2 id="navTitle"></h2>
  <span class="navbtn" hidden></span>
</header>
<div id="pill" role="status"><i></i><span></span></div>
<main id="view" aria-live="polite"></main>
<nav id="tabs" role="tablist" aria-label="Secciones"></nav>
<dialog id="sheet" aria-labelledby="shTitle"></dialog>

<script src="vendor/msal-browser.min.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
